<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1000" height="70" fill="#1e293b" />
  <text x="30" y="42" fill="#38bdf8" font-size="20" font-weight="bold">Arize Phoenix / LangSmith - Métricas de Costos y Tokens por Ejecución</text>
  <text x="710" y="42" fill="#94a3b8" font-size="14">Análisis Económico de Producción</text>

  <!-- Metric Summary Cards -->
  <rect x="30" y="95" width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="45" y="125" fill="#94a3b8" font-size="13">Costo Promedio / Run</text>
  <text x="45" y="160" fill="#34d399" font-size="24" font-weight="bold">$0.000086 USD</text>

  <rect x="270" y="95" width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="285" y="125" fill="#94a3b8" font-size="13">Costo Total Corrida (5 reqs)</text>
  <text x="285" y="160" fill="#a78bfa" font-size="24" font-weight="bold">$0.000860 USD</text>

  <rect x="510" y="95" width="215" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="525" y="125" fill="#94a3b8" font-size="13">Tokens Promedio (Input)</text>
  <text x="525" y="160" fill="#38bdf8" font-size="24" font-weight="bold">820 tokens</text>

  <rect x="750" y="95" width="220" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="765" y="125" fill="#94a3b8" font-size="13">Tokens Promedio (Output)</text>
  <text x="765" y="160" fill="#facc15" font-size="24" font-weight="bold">420 tokens</text>

  <!-- Table Container -->
  <rect x="30" y="210" width="940" height="300" rx="10" fill="#1e293b" stroke="#334155" />
  <text x="50" y="240" fill="#f8fafc" font-size="15" font-weight="bold">Desglose de Consumo por Nodo del Grafo (LLM: gemini-3.8-flash)</text>

  <!-- Table Headers -->
  <rect x="50" y="260" width="900" height="32" rx="4" fill="#0f172a" />
  <text x="70" y="281" fill="#94a3b8" font-size="12" font-weight="bold">NODO DEL GRAFO</text>
  <text x="280" y="281" fill="#94a3b8" font-size="12" font-weight="bold">PROMPT (INPUT)</text>
  <text x="440" y="281" fill="#94a3b8" font-size="12" font-weight="bold">COMPLETION (OUTPUT)</text>
  <text x="640" y="281" fill="#94a3b8" font-size="12" font-weight="bold">TOTAL TOKENS</text>
  <text x="810" y="281" fill="#94a3b8" font-size="12" font-weight="bold">COSTO ESTIMADO</text>

  <!-- Row 1: supervisor_node -->
  <text x="70" y="322" fill="#f8fafc" font-size="13">supervisor_node</text>
  <text x="280" y="322" fill="#94a3b8" font-size="13">160 tokens</text>
  <text x="440" y="322" fill="#94a3b8" font-size="13">50 tokens</text>
  <text x="640" y="322" fill="#38bdf8" font-size="13">210 tokens (17%)</text>
  <text x="810" y="322" fill="#34d399" font-size="13">$0.000027 USD</text>
  <line x1="50" y1="338" x2="950" y2="338" stroke="#334155" />

  <!-- Row 2: researcher_agent -->
  <text x="70" y="365" fill="#f8fafc" font-size="13">researcher_agent (ReAct)</text>
  <text x="280" y="365" fill="#94a3b8" font-size="13">240 tokens</text>
  <text x="440" y="365" fill="#94a3b8" font-size="13">140 tokens</text>
  <text x="640" y="365" fill="#facc15" font-size="13" font-weight="bold">380 tokens (31%)</text>
  <text x="810" y="365" fill="#34d399" font-size="13">$0.000060 USD</text>
  <line x1="50" y1="381" x2="950" y2="381" stroke="#334155" />

  <!-- Row 3: analyst_agent -->
  <text x="70" y="408" fill="#f8fafc" font-size="13">analyst_agent (ReAct)</text>
  <text x="280" y="408" fill="#94a3b8" font-size="13">200 tokens</text>
  <text x="440" y="408" fill="#94a3b8" font-size="13">90 tokens</text>
  <text x="640" y="408" fill="#38bdf8" font-size="13">290 tokens (23%)</text>
  <text x="810" y="408" fill="#34d399" font-size="13">$0.000042 USD</text>
  <line x1="50" y1="424" x2="950" y2="424" stroke="#334155" />

  <!-- Row 4: validator_node -->
  <text x="70" y="451" fill="#f8fafc" font-size="13">validator_node (Síntesis final)</text>
  <text x="280" y="451" fill="#94a3b8" font-size="13">220 tokens</text>
  <text x="440" y="451" fill="#94a3b8" font-size="13">140 tokens</text>
  <text x="640" y="451" fill="#facc15" font-size="13" font-weight="bold">360 tokens (29%)</text>
  <text x="810" y="451" fill="#34d399" font-size="13">$0.000058 USD</text>
  <line x1="50" y1="467" x2="950" y2="467" stroke="#334155" />

  <!-- Footnote -->
  <text x="50" y="495" fill="#64748b" font-size="11">* Precios calculados con base en tarifa oficial de Google GenAI Gemini Flash ($0.075 / 1M input, $0.30 / 1M output). El nodo Human-in-the-loop no consume tokens LLM.</text>
</svg>
